[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ruppert"
version = "0.1.0"
description = "Local, read-only codebase research assistant"
requires-python = ">=3.11"
dependencies = [
    "ollama>=0.5",
    "markdown-it-py>=4,<5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.9",
]

[project.scripts]
ruppert = "ruppert.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
